name: Windows C/C++ Make CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Quick MinGW and Make Toolchain
      uses: egor-tisin/setup-gcc@v1
      with:
        version: latest
        platform: x64

    - name: Compile Code Base with Make
      shell: bash
      run: |
        # Use mingw32-make only if your target handles 'clean', otherwise skip it
        mingw32-make clean || true
        mingw32-make

    - name: Verify Executable Presence
      shell: bash
      run: |
        if [ -f "a.exe" ]; then
          echo "Success: a.exe successfully generated."
        else
          echo "Error: a.exe was not found in the root directory."
          exit 1
        fi

    - name: Upload Compiled Binary
      uses: actions/upload-artifact@v4
      with:
        name: production-binary-windows
        path: a.exe
        retention-days: 7
