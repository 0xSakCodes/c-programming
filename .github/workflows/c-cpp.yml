name: Windows C/C++ Make CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Setup MSYS2 and MinGW Toolchain
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make

    - name: Compile Code Base with Make
      shell: msys2 {0}
      run: |
        mingw32-make clean || true
        mingw32-make

    - name: Verify Executable Presence
      run: |
        if (Test-Path "a.exe") {
          echo "Success: a.exe successfully generated."
        } else {
          echo "Error: a.exe was not found in the root directory."
          exit 1
        }

    - name: Upload Compiled Binary
      uses: actions/upload-artifact@v4
      with:
        name: production-binary-windows
        path: a.exe
        retention-days: 7
        
